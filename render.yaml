# Blueprint do Render: um serviço web (Docker) com API Django + React compilado.
# Banco: Neon (DATABASE_URL). E-mail: API HTTP do Brevo (o plano free bloqueia SMTP).
services:
  - type: web
    name: meudindin
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Os valores abaixo são preenchidos no painel do Render (sync: false)
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_TAG
        value: meudindin
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
